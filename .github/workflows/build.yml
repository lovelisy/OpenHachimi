name: Build

on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task to run
        required: true
        default: build
        type: choice
        options:
          - build
          - assemble
          - remapJar

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on JDK 21
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Tune Gradle memory
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G/' gradle.properties
          grep '^org.gradle.jvmargs' gradle.properties

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Read project metadata
        id: meta
        run: |
          version="$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')"
          archive="$(grep -E '^archives_base_name=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')"
          mcver="$(grep -E '^minecraft_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "mcver=${mcver}" >> "$GITHUB_OUTPUT"
          echo "artifact=${archive}-${version}-mc${mcver}" >> "$GITHUB_OUTPUT"

      - name: Run gradle
        run: ./gradlew ${{ inputs.task }} --stacktrace --no-daemon

      - name: List build output
        run: ls -lah build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Build finished"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Task | \`${{ inputs.task }}\` |"
            echo "| Minecraft | \`${{ steps.meta.outputs.mcver }}\` |"
            echo "| Version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Artifact | \`${{ steps.meta.outputs.artifact }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
